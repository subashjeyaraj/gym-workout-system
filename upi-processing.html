<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Hub - Processing Settlement</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .proc-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 45px 35px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: var(--shadow-card), 0 0 40px rgba(0, 246, 255, 0.2);
        }

        .proc-loader {
            width: 90px;
            height: 90px;
            margin: 0 auto 24px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid var(--cyan-glow);
            border-right: 5px solid var(--magenta-glow);
            animation: spin 1s linear infinite;
            box-shadow: 0 0 30px rgba(0, 246, 255, 0.6);
        }

        .status-feed {
            margin-top: 20px;
            font-size: 0.85em;
            color: var(--text-muted);
            min-height: 24px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="proc-box">
        <div class="proc-loader"></div>
        <h2 style="color: var(--cyan-glow); letter-spacing: 2px; text-transform: uppercase; font-size: 1.4em;">
            Processing Settlement
        </h2>
        <p style="color: var(--text-secondary); font-size: 0.9em; margin-top: 6px;" id="gatewayInfo">
            Connecting to Banking Server...
        </p>
        <div class="status-feed" id="statusFeed">> Handshaking protocol...</div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>
        const method = localStorage.getItem('gymPaymentMethod') || 'UPI Gateway';
        document.getElementById('gatewayInfo').textContent = `Encrypted via ${method}...`;

        const steps = [
            "> Initializing bank handshake...",
            "> Verifying merchant credentials...",
            "> Biometric encryption verified...",
            "> Transaction Approved! Finalizing order..."
        ];

        let currentStep = 0;
        const interval = setInterval(() => {
            currentStep++;
            if (currentStep < steps.length) {
                document.getElementById('statusFeed').textContent = steps[currentStep];
                playCyberSound('click');
            } else {
                clearInterval(interval);
                playCyberSound('success');
                setTimeout(() => {
                    window.location.href = "order-success.html";
                }, 400);
            }
        }, 700);
    </script>
</body>
</html>
