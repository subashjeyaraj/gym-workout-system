<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Hub - AI Fitness & Tactical Coach</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container-card {
            max-width: 850px;
            margin: 0 auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 26px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            height: 75vh;
        }

        .chat-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .coach-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .coach-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan-glow), var(--magenta-glow));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4em;
            box-shadow: 0 0 15px rgba(0, 246, 255, 0.4);
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 18px 8px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 0.92em;
            line-height: 1.5;
            animation: bubbleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            word-wrap: break-word;
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .user-bubble {
            align-self: flex-end;
            background: rgba(0, 246, 255, 0.15);
            border: 1px solid rgba(0, 246, 255, 0.4);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .bot-bubble {
            align-self: flex-start;
            background: rgba(22, 34, 52, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            border-bottom-left-radius: 2px;
        }

        .bot-bubble strong {
            color: var(--cyan-glow);
        }

        /* Quick Prompt Chips */
        .prompt-chips-tray {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0;
            white-space: nowrap;
        }

        .prompt-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 246, 255, 0.25);
            color: var(--cyan-glow);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.78em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .prompt-chip:hover {
            background: var(--cyan-glow);
            color: #000;
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        /* Chat Input Box */
        .chat-input-row {
            display: flex;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-row input {
            flex-grow: 1;
            padding: 13px 18px;
            border-radius: var(--radius-md);
        }

        /* Typing Dots */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 10px 18px;
            background: rgba(22, 34, 52, 0.9);
            border-radius: var(--radius-md);
            font-size: 0.8em;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dot-pulse {
            display: inline-block;
            animation: pulse 1s infinite alternate;
        }
    </style>
</head>
<body>

    <!-- Shared Top Navbar -->
    <div id="gym-navbar"></div>

    <div class="page-container">
        
        <div class="chat-container-card">
            
            <!-- Chat Header -->
            <div class="chat-topbar">
                <div class="coach-status">
                    <div class="coach-avatar">🤖</div>
                    <div>
                        <h3 style="font-size: 1.1em; color: #fff; margin: 0;">AI Tactical Coach</h3>
                        <span style="font-size: 0.78em; color: var(--green-glow);">● Online | Ready for Consultation</span>
                    </div>
                </div>

                <div>
                    <button class="btn btn-outline btn-sm" onclick="clearConversation()" style="font-size: 0.75em; padding: 4px 10px;">
                        Clear Chat
                    </button>
                </div>
            </div>

            <!-- Messages Stream -->
            <div class="chat-messages" id="chatStream">
                <div class="msg-bubble bot-bubble">
                    <strong>Greetings, Athlete!</strong> I am your Gym Hub Tactical Intelligence assistant. Ask me anything regarding <strong>Hypertrophy Splits</strong>, <strong>Caloric Deficit vs Bulking</strong>, <strong>Creatine Timing</strong>, or <strong>Joint Rehabilitation</strong>.
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                🤖 Coach is calculating tactical response<span class="dot-pulse">...</span>
            </div>

            <!-- Prompt Suggestions -->
            <div class="prompt-chips-tray">
                <button class="prompt-chip" onclick="askQuickPrompt('Best workout split for muscle gain?')">🏋️ Best Workout Split</button>
                <button class="prompt-chip" onclick="askQuickPrompt('How much protein should I eat daily?')">🍗 Protein Target</button>
                <button class="prompt-chip" onclick="askQuickPrompt('When should I take creatine?')">⚡ Creatine Timing</button>
                <button class="prompt-chip" onclick="askQuickPrompt('How to fix knee pain during squats?')">⚠️ Knee Pain</button>
                <button class="prompt-chip" onclick="askQuickPrompt('How many rest days do I need?')">💤 Rest & Recovery</button>
            </div>

            <!-- Chat Input Controls -->
            <div class="chat-input-row">
                <input type="text" id="coachInput" placeholder="Inquire about workouts, diet, or recovery..." onkeypress="handleEnter(event)">
                <button class="btn btn-primary" onclick="submitMessage()">
                    Transmit ➔
                </button>
            </div>

        </div>

    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>
        protectPage();
        renderNavbar('chatbot');

        const stream = document.getElementById('chatStream');
        const input = document.getElementById('coachInput');
        const typing = document.getElementById('typingIndicator');

        function appendMessage(text, isUser = false) {
            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${isUser ? 'user-bubble' : 'bot-bubble'}`;
            bubble.innerHTML = isUser ? escapeHtml(text) : text;
            stream.appendChild(bubble);
            stream.scrollTop = stream.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function askQuickPrompt(question) {
            input.value = question;
            submitMessage();
        }

        function handleEnter(e) {
            if (e.key === 'Enter') submitMessage();
        }

        function submitMessage() {
            const text = input.value.trim();
            if (!text) return;

            playCyberSound('click');
            appendMessage(text, true);
            input.value = '';

            typing.style.display = 'block';
            stream.scrollTop = stream.scrollHeight;

            setTimeout(() => {
                typing.style.display = 'none';
                const reply = computeTacticalResponse(text);
                appendMessage(reply, false);
                playCyberSound('success');
            }, 600);
        }

        function computeTacticalResponse(query) {
            const q = query.toLowerCase();

            // Splits / Workouts
            if (q.includes('split') || q.includes('workout') || q.includes('routine') || q.includes('hypertrophy') || q.includes('exercise')) {
                return `<strong>🏋️ Tactical Split Protocol:</strong><br>
                For maximum hypertrophy and recovery, execute the <strong>Push-Pull-Legs (PPL)</strong> split:
                <ul style="margin: 6px 0 0 16px;">
                    <li><strong>Push:</strong> Incline DB Press, Overhead Press, Cable Lateral Raises, Tricep Pushdowns.</li>
                    <li><strong>Pull:</strong> Lat Pulldown, Chest-Supported Rows, Facepulls, Incline Curls.</li>
                    <li><strong>Legs:</strong> Barbell Back Squats, Romanian Deadlifts, Bulgarian Split Squats, Calves.</li>
                </ul>
                Aim for 10-20 working sets per muscle group weekly within 1-3 Reps in Reserve (RIR).`;
            }

            // Protein & Diet
            if (q.includes('protein') || q.includes('diet') || q.includes('eat') || q.includes('calorie') || q.includes('nutrition') || q.includes('macro')) {
                return `<strong>🍗 Nutritional Optimization:</strong><br>
                • <strong>Protein Intake:</strong> Consume <strong>1.6 to 2.2 grams</strong> per kilogram of body weight daily (e.g. 75kg athlete = 120g - 165g protein).<br>
                • <strong>Timing:</strong> Distribute protein across 3-5 meals with ~25-40g per meal to sustain muscle protein synthesis.<br>
                • <strong>Caloric Framework:</strong> Surplus of +300-400 kcal for clean bulking, or deficit of -400-500 kcal for lean conditioning.`;
            }

            // Creatine & Supplements
            if (q.includes('creatine') || q.includes('supplement') || q.includes('whey') || q.includes('vitamin')) {
                return `<strong>💊 Supplement Protocol:</strong><br>
                • <strong>Creatine Monohydrate:</strong> Take <strong>5g daily</strong> consistently with water or carbs. Timing (pre or post workout) matters far less than daily saturation.<br>
                • <strong>Whey Isolate:</strong> Ideal for rapid amino acid replenishment within 1-2 hours around workout sessions.<br>
                • <strong>Essentials:</strong> Daily Vitamin D3 + K2 and Omega-3 fish oils ensure joint lubrication and hormone equilibrium.`;
            }

            // Injury / Pain
            if (q.includes('pain') || q.includes('knee') || q.includes('shoulder') || q.includes('back') || q.includes('injury') || q.includes('hurt')) {
                return `<strong>⚠️ Joint & Injury Recovery Protocol:</strong><br>
                • <strong>Immediate Action:</strong> Cease any exercise provoking sharp, acute pain (>3/10 discomfort).<br>
                • <strong>Active Rehabilitation:</strong> Instead of complete immobilization, perform high-rep isometric holds and banded blood flow movements.<br>
                • <strong>Shoulders:</strong> Focus on external rotator cuff strengtheners (Face Pulls, Band Pull-Aparts).<br>
                • <strong>Knees:</strong> Warm up with reverse walking, terminal knee extensions, and foam rolling quads. Consult a medical professional if pain persists.`;
            }

            // Rest & Sleep
            if (q.includes('rest') || q.includes('sleep') || q.includes('recovery') || q.includes('fatigue')) {
                return `<strong>💤 CNS Recovery & Sleep Protocol:</strong><br>
                • Muscles grow outside the gym during deep REM sleep when Growth Hormone (HGH) peaks.<br>
                • Target <strong>7.5 - 9 hours</strong> of uninterrupted sleep in a cool, dark room.<br>
                • Take at least <strong>1 to 2 complete rest days</strong> every week to prevent systemic Central Nervous System fatigue.`;
            }

            // Default
            return `<strong>🤖 Tactical Intelligence Note:</strong><br>
            I have analyzed your query. To give you the exact protocol, please specify whether your primary focus is <strong>Workout Splits</strong>, <strong>Macro Nutrition</strong>, <strong>Supplements (Creatine/Whey)</strong>, or <strong>Injury Prevention</strong>.`;
        }

        function clearConversation() {
            playCyberSound('click');
            stream.innerHTML = `
                <div class="msg-bubble bot-bubble">
                    <strong>Chat reset.</strong> Coach is standing by for new tactical fitness queries.
                </div>
            `;
            showGymToast("Conversation cleared.", "info");
        }
    </script>
</body>
</html>
